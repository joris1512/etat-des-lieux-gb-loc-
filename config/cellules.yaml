# Cellules d'écriture dans les modèles Excel.
#
# ⚠️ COORDONNÉES PROVISOIRES — calées sur les MODÈLES FACTICES générés par
#    scripts/make_placeholder_templates.py. Lundi, avec les vrais .xlsx sous les yeux,
#    il suffit de remplacer ces coordonnées par les vraies cellules (rien d'autre à toucher).
#
# Pour chaque modèle :
#   feuille  : nom de l'onglet (null = onglet actif)
#   entete   : champ d'en-tête -> cellule
#   mobilier : MOT-CLÉ (cherché dans la désignation du mobilier) -> cellule où reporter la quantité
#              Le mot-clé le plus long qui correspond gagne.

# Modèles pour l'état "assemblé" (regroupe N bungalows). Le kit (kitchenette) est choisi
# automatiquement quand le mobilier du bloc contient de l'équipement cuisine.
modele_assemble: bungalow_assemble.xlsx
modele_assemble_kit: bungalow_assemble_kit.xlsx

# Variantes de bungalow INDIVIDUEL — choisies automatiquement par déduction
# (taille + mots-clés de la ligne/du bloc + mobilier + fonction), modifiables au cas par cas
# via le menu déroulant de l'étape de révision.
bungalow_variantes:
  vide: bungalow_vide.xlsx
  mobilier: bungalow_mobilier.xlsx
  8m2_vide: bungalow_8m2_vide.xlsx
  8m2_sanitaire: bungalow_8m2_sanitaire.xlsx
  20m2_vide: bungalow_20m2_vide.xlsx
  coin_sanitaire: bungalow_coin_sanitaire.xlsx
  coin_sanitaire_kitchenette: bungalow_coin_sanitaire_kitchenette.xlsx
  refectoire_kitchenette: bungalow_refectoire_kitchenette.xlsx
  petite_enfance: bungalow_petite_enfance.xlsx

# Libellés courts du mobilier sur les états des lieux (norme GB) : le devis dit
# « TABLE MODULAIRE RECT. 160X80 », l'état affiche « Tables : N ». Le motif le plus long
# qui correspond gagne ; les articles regroupés sous un même libellé additionnent leurs
# quantités ; un article sans correspondance garde sa désignation du devis telle quelle.
mobilier_libelles:
  - {motif: EVIER CHAUFFE EAU, libelle: "Evier + chauffe-eau"}
  - {motif: ARMOIRE DOUBLE, libelle: "Armoires doubles"}
  - {motif: ARMOIRE HAUTE, libelle: "Armoires bureau hautes"}
  - {motif: ARMOIRE BASSE, libelle: "Armoires bureau basses"}
  - {motif: MICRO ONDES, libelle: "Micro-ondes"}
  - {motif: REFRIGERATEUR, libelle: "Frigo"}
  - {motif: CHAUFFE EAU, libelle: "Chauffe-eau"}
  - {motif: PLAQUE, libelle: "Plaques électriques"}
  - {motif: FAUTEUIL, libelle: "Fauteuils"}
  - {motif: CAISSON, libelle: "Caissons"}
  - {motif: ARMOIRE, libelle: "Armoires"}
  - {motif: CHAISE, libelle: "Chaises"}
  - {motif: TABLE, libelle: "Tables"}
  - {motif: EVIER, libelle: "Evier"}
  - {motif: BANC, libelle: "Bancs"}
  - {motif: RING, libelle: "Ring en toiture"}

# Fonctions de bungalow reconnues -> texte canonique reporté sur la ligne « fonction ».
# Pour chaque fonction, les mots-clés cherchés dans le « bloc » du devis (après normalisation :
# majuscules / sans accents). Le 1er motif trouvé gagne : l'ordre fixe donc la priorité.
fonctions:
  - texte: SALLE DE REUNION
    motifs: [REUNION]
  - texte: VESTIAIRE
    motifs: [VESTIAIRE]
  - texte: REFECTOIRE
    motifs: [REFECTOIRE]
  - texte: BUREAU
    motifs: [BUREAU]

defaut:
  feuille: null
  # Cellule de la ligne « fonction » (null = ce modèle n'a pas de fonction à reporter).
  fonction: null
  entete:
    client: B2
    titre_chantier: B3
    adresse: B4
    code_postal: B5
    ville: B6
  mobilier:
    TABLE: E10
    CHAISE: E11
    BANC: E12
    ARMOIRE: E13
    FAUTEUIL: E14
    CAISSON: E15
    REFRIGERATEUR: E16
    MICRO ONDES: E17
    EVIER: E18

# Surcharges par modèle (vide = hérite de `defaut`).
modeles:
  # --- Bungalows : VRAIS modèles (onglets extraits de « ENLEVEMENT ROULANTE.xlsx ») ---
  # En-tête : le libellé fait partie de la cellule -> préfixe via entete_format.
  # Fonction : on REMPLACE la ligne « BUREAU / SALLE DE REUNION / VESTIAIRE / REFECTOIRE ».
  bungalow_15m2.xlsx:
    feuille: bungalow
    fonction: A9
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "Client : {valeur}", titre_chantier: "Chantier : {valeur}"}
    mobilier: {}
  # Assemblés : VRAIS modèles dédiés (« BUNG ASSEMBLES », variante kit = kitchenette).
  bungalow_assemble.xlsx:
    feuille: "Bungalows Assemblés"
    entete: {client: E6, titre_chantier: E7}
    entete_format: {client: "Client : {valeur}", titre_chantier: "Chantier : {valeur}"}
    fonctions_cellules: {REFECTOIRE: C12, BUREAU: E12, SALLE DE REUNION: G12}
    mobilier: {}
    # L'état assemblé porte le MOBILIER du bloc : liste complète sur les lignes A43-A47.
    mobilier_zone: [A43, A44, A45, A46, A47]
  bungalow_assemble_kit.xlsx:
    feuille: "Bungalows Assemblés"
    entete: {client: E6, titre_chantier: E7}
    entete_format: {client: "Client : {valeur}", titre_chantier: "Chantier : {valeur}"}
    mobilier: {}
    # Kit choisi uniquement quand le mobilier est 100 % kitchenette -> liste sur la ligne évier.
    mobilier_zone: [A36]
  # --- Bungalows individuels RÉELS : vide / avec mobilier. En-tête E5/E6 (CLIENT : / CHANTIER :).
  #     Fonction = 4 cases séparées (réunion B8 / vestiaire D8 / bureau E8 / réfectoire G8). ---
  bungalow_vide.xlsx:
    feuille: "Bungalow vide"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {SALLE DE REUNION: B8, VESTIAIRE: D8, BUREAU: E8, REFECTOIRE: G8}
    mobilier: {}
  bungalow_mobilier.xlsx:
    feuille: "Bungalow avec mobiliers"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {SALLE DE REUNION: B8, VESTIAIRE: D8, BUREAU: E8, REFECTOIRE: G8}
    mobilier: {}
    # Zone d'inventaire (cellule multi-lignes A46) : reçoit la liste COMPLÈTE du devis.
    mobilier_zone: [A46]
  # --- Variantes de bungalow (VRAIS modèles du dossier « ungalow ») ---
  bungalow_8m2_vide.xlsx:
    feuille: "Bungalow 8M²"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {REFECTOIRE: B8, BUREAU: D8, SALLE DE REUNION: E8, VESTIAIRE: G8}
    mobilier: {}
    # R6 : le 8m² n'a pas de ligne mobilier dédiée -> le mobilier va dans « DIVERS » (case C46).
    mobilier_zone: [C46]
  bungalow_8m2_sanitaire.xlsx:
    feuille: "Bungalow 8M² coin Sanitaire"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {REFECTOIRE: B9, BUREAU: D9, SALLE DE REUNION: E9, VESTIAIRE: G9}
    mobilier: {}
    mobilier_zone: [C46]
  bungalow_20m2_vide.xlsx:
    feuille: "Bungalow vide"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  bungalow_coin_sanitaire.xlsx:
    feuille: "Bungalow avec coin Sanitaire"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {REFECTOIRE: B8, BUREAU: D8, SALLE DE REUNION: E8, VESTIAIRE: G8}
    mobilier: {}
  bungalow_coin_sanitaire_kitchenette.xlsx:
    feuille: "Bungalow coin Sanit + Kitch"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {REFECTOIRE: B8, BUREAU: D8, SALLE DE REUNION: E8, VESTIAIRE: G8}
    mobilier: {}
  bungalow_refectoire_kitchenette.xlsx:
    feuille: "Bungalow coin Sanit + Kitch"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {REFECTOIRE: D8}
    mobilier: {}
    # Section MOBILIERS du réfectoire : liste (hors kitchenette) sur A49-A50.
    mobilier_zone: [A49, A50]
    # Kitchenette : quantités du DEVIS (0 si absent), pas la valeur « 1 » imprimée d'office.
    kitchenette:
      - {cellule: A52, label: "Evier", motif: "EVIER"}
      - {cellule: A53, label: "Chauffe-eau", motif: "CHAUFFE EAU"}
      - {cellule: A54, label: "Micro-ondes", motif: "MICRO ONDES"}
      - {cellule: A55, label: "Frigo", motif: "REFRIGERATEUR"}
  bungalow_petite_enfance.xlsx:
    feuille: "Bungalow vide"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    fonctions_cellules: {REFECTOIRE: B8, BUREAU: D8, SALLE DE REUNION: E8, VESTIAIRE: G8}
    mobilier: {}
  bungalow_lavabos.xlsx:
    feuille: "Bungalow lavabo"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  # --- Sanitaire 1WC : VRAI modèle (BLOC 1 WC). En-tête « CLIENT : » / « CHANTIER : » en E5/E7. ---
  sanitaire_1wc.xlsx:
    feuille: WC
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  # --- Sanitaires EIFFAGE : ENCORE sur modèles factices (modèle réel à choisir + brancher) ---
  sanitaire_2wc_2d_2u.xlsx:
    # 2 WC / 2 douches / 2 urinoirs = GRAND SANITAIRE MIXTE (vrai modèle client).
    feuille: "Grand Sanitaire Mixte"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  sanitaire_2wc_pmr.xlsx:
    # Bloc 2 WC dont PMR = vrai modèle client « BLOC 2WCH » (onglet 2WCH).
    feuille: "2WCH"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  # --- Conteneur 6 m maritime : VRAI modèle (onglet avec perspectives), en-tête E5/E7 ---
  container_6m.xlsx:
    feuille: CONTAINER 6m (perspectives)
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  # --- Sanitaires réels (intégration en lot, motifs à valider) ---
  wc_1_pmr.xlsx:
    feuille: "WC"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  wc_2.xlsx:
    feuille: "2WCH"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  wc_3.xlsx:
    feuille: "WC"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  urinoirs_4.xlsx:
    feuille: "BLOC 4 URINOIRS"
    entete: {client: F5, titre_chantier: F7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  urinoirs_7.xlsx:
    feuille: "7 URINOIRS"
    entete: {client: E5, titre_chantier: E6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  lave_mains.xlsx:
    feuille: "BLOC 4 URINOIRS"
    entete: {client: F5, titre_chantier: F7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  roulante_vip_2wc.xlsx:
    feuille: "2WCH"
    entete: {client: I5, titre_chantier: I6}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  sanitaire_2wc_2ur.xlsx:
    feuille: "2WC_2UR - W99375"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  urinoir_feminin.xlsx:
    feuille: "URINOIR FEMININ"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  wc_autonome.xlsx:
    feuille: "WC CHIMIQUE"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
    # R2 : emplacements des WC (« V : … »). On garde `nb_modules` (1..3), on efface le reste.
    wc_emplacements: [A7, A8, A9]
    # Agrandir les lignes doses (36) et mise en eau (37) pour qu'elles ne soient pas coupées à l'impression.
    hauteur_lignes: [36, 37]
  sanitaire_grand_mixte.xlsx:
    feuille: "Grand Sanitaire Mixte"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  sanitaire_petit_mixte.xlsx:
    feuille: "Sanitaire Petit Mixte"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  douches.xlsx:
    feuille: "Grand Sanitaire Douche"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  polysani_handi.xlsx:
    feuille: "Polysani H"
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    # titre_contenu (règle Joris) : réécrit le titre du bloc (A6) avec le contenu réel lu sur la
    # ligne du devis (ex. « 5WC / 3UR »), au lieu du texte figé du modèle.
    titre_contenu: {cellule: A6, gabarit: "Sanitaire : {contenu} (POLYSANI HANDI)"}
    mobilier: {}
  polysani_homme_femme.xlsx:
    feuille: "Polysani Homme-Femme"
    entete: {client: D5, titre_chantier: D7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    titre_contenu: {cellule: A6, gabarit: "Sanitaire : BLOC {contenu} (POLYSANI)"}
    mobilier: {}
  cuve.xlsx:
    feuille: "Feuil1"
    entete: {client: A6, titre_chantier: A7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
    # Cuve : taille (3m/6m -> « CUVE N M3 » en A13) + RACCORDS = 1 si branchement au devis (A24).
    cuve: {taille_cellule: A13, raccords_cellule: A24}
