# Cellules d'écriture dans les modèles Excel.
#
# ⚠️ COORDONNÉES PROVISOIRES — calées sur les MODÈLES FACTICES générés par
#    scripts/make_placeholder_templates.py. Lundi, avec les vrais .xlsx sous les yeux,
#    il suffit de remplacer ces coordonnées par les vraies cellules (rien d'autre à toucher).
#
# Pour chaque modèle :
#   feuille  : nom de l'onglet (null = onglet actif)
#   entete   : champ d'en-tête -> cellule
#   mobilier : MOT-CLÉ (cherché dans la désignation du mobilier) -> cellule où reporter la quantité
#              Le mot-clé le plus long qui correspond gagne.

# Modèle pour l'état "assemblé" (regroupe N bungalows). Référencé automatiquement.
modele_assemble: bungalow_assemble.xlsx

# Fonctions de bungalow reconnues -> texte canonique reporté sur la ligne « fonction ».
# Pour chaque fonction, les mots-clés cherchés dans le « bloc » du devis (après normalisation :
# majuscules / sans accents). Le 1er motif trouvé gagne : l'ordre fixe donc la priorité.
fonctions:
  - texte: SALLE DE REUNION
    motifs: [REUNION]
  - texte: VESTIAIRE
    motifs: [VESTIAIRE]
  - texte: REFECTOIRE
    motifs: [REFECTOIRE]
  - texte: BUREAU
    motifs: [BUREAU]

defaut:
  feuille: null
  # Cellule de la ligne « fonction » (null = ce modèle n'a pas de fonction à reporter).
  fonction: null
  entete:
    client: B2
    titre_chantier: B3
    adresse: B4
    code_postal: B5
    ville: B6
  mobilier:
    TABLE: E10
    CHAISE: E11
    BANC: E12
    ARMOIRE: E13
    FAUTEUIL: E14
    CAISSON: E15
    REFRIGERATEUR: E16
    MICRO ONDES: E17
    EVIER: E18

# Surcharges par modèle (vide = hérite de `defaut`).
modeles:
  # --- Bungalows : VRAIS modèles (onglets extraits de « ENLEVEMENT ROULANTE.xlsx ») ---
  # En-tête : le libellé fait partie de la cellule -> préfixe via entete_format.
  # Fonction : on REMPLACE la ligne « BUREAU / SALLE DE REUNION / VESTIAIRE / REFECTOIRE ».
  bungalow_15m2.xlsx:
    feuille: bungalow
    fonction: A9
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "Client : {valeur}", titre_chantier: "Chantier : {valeur}"}
    mobilier: {}
  bungalow_assemble.xlsx:
    feuille: BUNGALOWS ASSEMBLES
    fonction: B12
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "Client : {valeur}", titre_chantier: "Chantier : {valeur}"}
    mobilier: {}
  # --- Sanitaire 1WC : VRAI modèle (BLOC 1 WC). En-tête « CLIENT : » / « CHANTIER : » en E5/E7. ---
  sanitaire_1wc.xlsx:
    feuille: WC
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
  # --- Sanitaires EIFFAGE : ENCORE sur modèles factices (modèle réel à choisir + brancher) ---
  sanitaire_2wc_2d_2u.xlsx:
    # Un sanitaire n'a pas de mobilier de bureau : on ne reporte que l'en-tête.
    mobilier: {}
  sanitaire_2wc_pmr.xlsx:
    mobilier: {}
  # --- Conteneur 6 m maritime : VRAI modèle (onglet avec perspectives), en-tête E5/E7 ---
  container_6m.xlsx:
    feuille: CONTAINER 6m (perspectives)
    entete: {client: E5, titre_chantier: E7}
    entete_format: {client: "CLIENT : {valeur}", titre_chantier: "CHANTIER : {valeur}"}
    mobilier: {}
